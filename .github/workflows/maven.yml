name: Build BetterRent

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Plugin
        run: mvn clean package

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: BetterRent
          path: target/*.jar
